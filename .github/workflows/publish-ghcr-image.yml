name: Publish GHCR Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish, e.g. dev, v1.90.1, or main-stable"
        required: true
        type: string
      image_name:
        description: "GHCR image name"
        required: false
        default: litellm
        type: string
      push_latest:
        description: "Also push the latest tag"
        required: false
        default: false
        type: boolean
      platforms:
        description: "Comma-separated target platforms"
        required: false
        default: linux/arm64
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Push Image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Set image tags
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
          IMAGE_PLATFORMS: ${{ inputs.platforms }}
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image_name="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${image_name}"
          tags="${image}:${IMAGE_TAG}"
          if [ "$PUSH_LATEST" = "true" ]; then
            tags="${tags},${image}:latest"
          fi
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "TAGS=${tags}" >> "$GITHUB_ENV"
          echo "IMAGE_PLATFORMS=${IMAGE_PLATFORMS}" >> "$GITHUB_ENV"
          echo "Publishing ${tags} for ${IMAGE_PLATFORMS}"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push image
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497 # v6.14.0
        with:
          context: .
          file: ./docker/Dockerfile.non_root
          platforms: ${{ env.IMAGE_PLATFORMS }}
          tags: ${{ env.TAGS }}
          push: true
